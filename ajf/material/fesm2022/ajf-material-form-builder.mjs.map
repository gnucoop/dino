<h3 matDialogTitle>{{'Default columns'|transloco}}</h3>
<mat-dialog-content>
  <p>{{'Select the fields that will be shown as columns in the form list page'|transloco}}</p>
  <mat-form-field class="ajf-string-identifier-select">
    <mat-select multiple [(ngModel)]="selectedFieldNames">
      <mat-option>
        <ngx-mat-select-search
          [formControl]="searchFilterCtrl"
          [placeholderLabel]="'Search'|transloco"
          [noEntriesFoundLabel]="'Nothing found'|transloco"
          [enableClearOnEscapePressed]="true">
        </ngx-mat-select-search>
      </mat-option>
      <mat-option *ngFor="let field of filteredFields$ | async" [value]="field.name">
        {{field.label || field.name}}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button color="warn" matDialogClose>
    {{'Close'|transloco}}
  </button>
  <button mat-raised-button color="primary" matDialogClose (click)="saveStringIdentifier()">
    {{'Save'|transloco}}
  </button>
</mat-dialog-actions>
