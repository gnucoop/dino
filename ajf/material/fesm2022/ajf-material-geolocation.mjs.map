<div class="ajf-geo">
  <span class="ajf-geo-coord">
    <label class="ajf-geo-coord-label">{{ 'Lat' | transloco }}</label>
    <input
      [(ngModel)]="latitude"
      (focus)="focusHandler()"
      [attr.aria-label]="'Latitude' | transloco"
    />
  </span>
  <span class="ajf-geo-coord">
    <label class="ajf-geo-coord-label">{{ 'Lng' | transloco }}</label>
    <input
      [(ngModel)]="longitude"
      (focus)="focusHandler()"
      [attr.aria-label]="'Longitude' | transloco"
    />
  </span>
  <button type="button" class="ajf-geo-locate" (click)="getLocation()">
    <mat-icon>my_location</mat-icon>
    <span>{{ 'Locate' | transloco }}</span>
  </button>
</div>
