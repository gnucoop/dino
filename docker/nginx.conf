server {
    listen 80;
    server_name localhost;
    
    # La cartella dove si trovano i file compilati di Angular
    root /usr/share/nginx/html;
    index index.html;

    # Attiviamo la compressione Gzip per velocizzare il caricamento dell'app
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    location / {
        # REGOLA D'ORO PER LE SPA:
        # 1. Cerca il file esatto ($uri)
        # 2. Se non lo trova, cerca una cartella ($uri/)
        # 3. Se non trova nemmeno quella, reindirizza tutto a index.html
        try_files $uri $uri/ /index.html;
    }

    # Opzionale: diciamo al browser di tenere in cache le immagini e i font
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
