<div id="mapContainer"></div>
<div id="filtersContainer">
  <mat-form-field>
    <mat-label>Date range</mat-label>
    <mat-date-range-input [rangePicker]="rangePicker">
      <input matStartDate placeholder="From date">
      <input matEndDate placeholder="To date">
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="rangePicker"></mat-datepicker-toggle>
    <mat-date-range-picker #rangePicker></mat-date-range-picker>
  </mat-form-field>
  <app-text-input-autocomp *ngFor="let h of headers"
    [label]="h.label" [options]="fieldValues[h.column]">
  </app-text-input-autocomp>
  <div id="applyFilters">
    <button (click)="applyFilters()" mat-raised-button>Apply Filters</button>
  </div>
</div>
