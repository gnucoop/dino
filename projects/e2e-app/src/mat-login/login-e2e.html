<dino-login
  [postLogin]="postLogin"
  [privacyPolicy]="policy"
  [logoImagePath]="'https://e-laics.gnucoop.com/wp-content/uploads/2021/01/cropped-logognu-nonprofit-e1613290012970.png'"
>
  <ng-container additionalContent>
    <div
      style="
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20vh;
      "
    >
      <mat-icon aria-hidden="false" aria-label="Light mode" style="opacity: 0.5"
        >wb_sunny</mat-icon
      >
      <mat-slide-toggle [checked]="ts.isDark()" (change)="setDarkTheme($event.checked)" style="margin: 20px" aria-label="Toggle Dino Theme">
      </mat-slide-toggle>
      <mat-icon aria-hidden="false" aria-label="Dark mode" style="opacity: 0.5"
        >nights_stay</mat-icon
      >
    </div>
  </ng-container>

  <mat-form-field *ngIf="dynamicConfig" class="dino-platform-dropdown" dropdownSelect>
    <mat-label>Choose your platform</mat-label>
    <mat-select #platformselect>
      <mat-option
        *ngFor="let set of configurationSets|async"
        [value]="set"
      >
        {{set.name}}
      </mat-option>
    </mat-select>
  </mat-form-field>
</dino-login>
