<div class="dino-map-toolbar">
  <dino-breadcrumbs></dino-breadcrumbs>
  <div class="dino-map-count">
    <mat-icon color="primary">place</mat-icon>
    <span>
      <b>{{pinCount}}</b> {{'pin'|transloco}} ·
      <b>{{dataSource.dataResultsCount|async}}</b> {{'Items found'|transloco}}
    </span>
  </div>
</div>
<dino-search-filters-bar
  [presetManager]="true"
  [keywordSearch]="false"
  [exportable]="true"
  [aggregationFilters]="false"
  [secondaryMetricFieldsDisplayed]="secondaryMetricFieldsDisplayed"
  (exportEvt)="export($event)"
>
  <mat-form-field *ngIf="geoFields.length > 0" toolbarActions class="dino-map-pin-source">
    <span matTextPrefix>{{'Coordinates from'|transloco}}:&nbsp;</span>
    <mat-select [value]="pinSource.value" (selectionChange)="pinSource.next($event.value)">
      <mat-option [value]="locationPinSource">{{'Location'|transloco}}</mat-option>
      <mat-option *ngFor="let field of geoFields" [value]="field.column">{{field.label}}</mat-option>
    </mat-select>
  </mat-form-field>
</dino-search-filters-bar>
<div id="mapContainer"></div>
