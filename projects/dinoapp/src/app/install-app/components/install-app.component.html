<mat-toolbar
  *ngIf="data.mobileType === 'android' || data.mobileType === 'browser'"
  class="android-prompt"
  style="display: flex; justify-content: center; flex-flow: row wrap;"
>
  <button style="text-align: center;" mat-button (click)="installPwa()">
    {{ 'Add Dino to your Home' | transloco }}
  </button>
</mat-toolbar>

<div
  *ngIf="data.mobileType === 'ios'"
  class="ios-prompt"
  style="display: flex; justify-content: center; flex-flow: row wrap;"
>
  <div style="text-align: center;">
    {{ 'To install this web app on your device tap the Menu button and then \'Add to Home screen\' button' | transloco }}
  </div>
  <div>
    <mat-icon>navigate_next</mat-icon>
  </div>
</div>
