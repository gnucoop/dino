<ng-container *ngIf="formGroup|async as fg">
  <form novalidate [formGroup]="fg">
    <div class="ajf-form-container">
      <div class="ajf-form-page" *ngIf="fieldInstance|async as field">
        <mat-card appearance="outlined" class="mat-elevation-z4">
          <div class="elem">
            <mat-card-header>
              <mat-card-title>
                {{ (field.node.description ? field.node.description : ' ')|transloco }}
              </mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <i [class]="field.node.fieldType | ajfFieldIcon" item-right></i>
              <label
                class="dino-filter-widget-label"
                *ngIf="field.node.fieldType !== ajfFieldTypes.Empty"
                [innerHTML]="field.node.label|transloco"
              ></label>
              <ajf-field [instance]="field"></ajf-field>
              <ng-container *ngIf="conditionOperatorByFieldType(field.node.fieldType) as operators">
                <ng-container *ngIf="operators.length > 0">
                  <mat-button-toggle-group
                    #group
                    *ngIf="(field.node|asFilterItem).operator as operator"
                    (change)="changeOperator($event)"
                    [value]="operator ? operator.label : null "
                  >
                    <mat-button-toggle
                      *ngFor="let operator of operators"
                      [value]="operator"
                      [checked]="operatorValue.getValue().value === operator.value"
                    >
                      {{ operator.label|transloco }}
                    </mat-button-toggle>
                  </mat-button-toggle-group>
                </ng-container>
              </ng-container>
            </mat-card-content>
          </div>
          <mat-card-actions>
            <button
              class="dino-create-filter-button"
              [disabled]="(isCreateFilterButtonDisabled|async) !== false && !isNoValueOperator()"
              mat-raised-button
              (click)="createFilter()"
              color="accent"
            >
              {{'Create Filter'|transloco}}<mat-icon>add</mat-icon>
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </form>
</ng-container>
