<div class="dino-langs-page-header">
  <div class="dino-langs-page-title">
    <h1>{{'Translations'|transloco}}</h1>
    <p>{{keysCount$|async}} {{'keys'|transloco}} · {{donePct$|async}}% {{'complete'|transloco}}</p>
  </div>
  <div class="dino-langs-page-actions">
    <button
      type="button"
      class="dino-langs-btn dino-langs-btn-primary"
      (click)="openAddTranslation()"
    >
      <mat-icon>add</mat-icon>
      {{'Translation'|transloco}}
    </button>
    <button type="button" class="dino-langs-btn" (click)="openAddLanguage()">
      <mat-icon>translate</mat-icon>
      {{'All languages'|transloco}}
    </button>
  </div>
</div>

<dino-langs-loading *ngIf="loading$|async"></dino-langs-loading>

<div class="dino-langs-panes">
  <div class="dino-langs-pane-master">
    <dino-langs-key-list></dino-langs-key-list>
  </div>
  <div class="dino-langs-pane-detail">
    <dino-langs-detail></dino-langs-detail>
  </div>
</div>
