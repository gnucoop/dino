<mat-chip-listbox aria-label="Fish selection">
  <mat-chip-option *ngFor="let item of chipsFilters|async">
    <span style="margin-right: 5px">
      {{ (item.label ? item.label : item.name)|transloco|uppercase|slice:0:30 }}
    </span>
    {{ item?.operator?.label ? item?.operator?.label: ' '|transloco}} {{
    item.value|json }}
    <mat-icon matChipRemove (click)="removeFilterItem(item)">
      {{'cancel'|transloco}}
    </mat-icon>
  </mat-chip-option>
</mat-chip-listbox>
