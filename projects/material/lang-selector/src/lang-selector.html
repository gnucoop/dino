<mat-form-field>
  <mat-select-trigger> {{ currentLang }} </mat-select-trigger>
  <mat-select [aria-label]="'Language'|transloco">
    @for (lang of langsShowed$|async; track lang) {
      <mat-option (click)="setLang(lang)"
        >{{ lang }}</mat-option
      >
    }
  </mat-select>
</mat-form-field>
