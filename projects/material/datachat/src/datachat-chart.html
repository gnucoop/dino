<div class="dino-datachat-chart">
  @if (title) {
    <span class="dino-datachat-chart-title">{{title}}</span>
  }
  @if (status === 'ok') {
    <div class="dino-datachat-chart-canvas-container">
      <canvas #chartCanvas></canvas>
    </div>
  } @else {
    <div class="dino-datachat-chart-fallback">
      <mat-icon class="dino-datachat-entry-icon" color="warn">bar_chart</mat-icon>
      @if (status === 'empty') {
        <span>{{'No data to display'|transloco}}</span>
      } @else {
        {{'This chart could not be displayed'|transloco}}
      }
    </div>
  }
</div>
