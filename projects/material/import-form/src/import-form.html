<dino-import-wizard
  [title]="'Import form data' | transloco"
  [fields]="fields"
  [outcome]="outcome"
  [busy]="importing"
  (apply)="onApply($event)"
  (cancelled)="cancelled.emit()"
  (closed)="onClosed()"
  (unreadableFile)="onUnreadableFile()"
>
  <div breadcrumbs><ng-content select="[breadcrumbs]"></ng-content></div>

  <label options class="dino-imp-reuse">
    <mat-checkbox [formControl]="reuseMetricName" color="primary"></mat-checkbox>
    {{ 'Reuse existing metrics with the same name' | transloco }}
  </label>
</dino-import-wizard>
