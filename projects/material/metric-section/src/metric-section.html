<dino-list
  #dinoList
  [title]="metricLabel"
  [headers]="headers"
  [dataSource]="dataSource"
  [listRowActions]="listRowActions"
  [bulkActionsAvailable]="bulkActionsAvailable"
  [bulkDeleteAction]="bulkDeleteAction"
  [onClickRowActions]="onClickRowActions"
>
  <dino-search-filters-bar
    filters
    [additionalFilters]="false"
    [exportable]="true"
    (exportEvt)="dinoList.export($event, 'metrics')"
  >
    <button toolbarActions mat-stroked-button color="primary" (click)="openDialog(undefined, 'Create')">
      <mat-icon>add</mat-icon>
      <span>{{('Add New'|transloco) + ' ' + metricLabel}}</span>
    </button>
    <button toolbarActions mat-stroked-button color="primary" (click)="openImportMetrics()">
      <mat-icon>cloud_upload</mat-icon>
      <span>{{('Import'|transloco) + ' ' + metricLabel}}</span>
    </button>
  </dino-search-filters-bar>
  <ng-content select="[breadcrumbs]" breadcrumbs></ng-content>
</dino-list>
