<dino-list
  #dinoList
  [title]="metricLabel"
  [headers]="headers"
  [dataSource]="dataSource"
  [listRowActions]="listRowActions"
  [bulkActionsAvailable]="bulkActionsAvailable"
  [bulkDeleteAction]="bulkDeleteAction"
  [onClickRowActions]="onClickRowActions"
>
  <dino-search-filters-bar
    filters
    [additionalFilters]="false"
    [exportable]="true"
    (exportEvt)="dinoList.export($event, 'metrics')"
  ></dino-search-filters-bar>
  <ng-content select="[breadcrumbs]" breadcrumbs></ng-content>
</dino-list>

<dino-floating-button
  buttonIcon="add"
  [tooltipMessage]="('Add New'|transloco) + ' ' + metricLabel"
  (click)="openDialog(undefined, 'Create')"
></dino-floating-button>

<dino-floating-button
  [buttonIcon]="'cloud_upload'"
  [tooltipMessage]="('Import'|transloco) + ' ' + metricLabel"
  (click)="openImportMetrics()"
></dino-floating-button>
