<dino-import-wizard
  [title]="('Import metrics' | transloco) + ' ' + (metricName | transloco)"
  [fields]="fields"
  [outcome]="outcome"
  [busy]="importing"
  (apply)="onApply($event)"
  (cancelled)="cancelled.emit()"
  (closed)="onClosed()"
  (unreadableFile)="onUnreadableFile()"
>
  <div breadcrumbs><ng-content select="[breadcrumbs]"></ng-content></div>

  <label options class="dino-metric-imp-reuse">
    <mat-checkbox [formControl]="reuseMetricName" color="primary"></mat-checkbox>
    {{ "Don't import metrics if name exists" | transloco }}
  </label>
</dino-import-wizard>
