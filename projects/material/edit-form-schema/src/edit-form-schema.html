<ng-container *ngIf="form|async as form">
  <mat-card appearance="outlined" class="form-container">
    <ng-content select="[breadcrumbs]"></ng-content>
    <mat-card-header>
      <ng-container *ngIf="formGroup|async as fgroup">
        <form [formGroup]="fgroup" class="dino-form-attributes">
          <mat-form-field>
            <b><input matInput formControlName="label" [placeholder]="'Form Label'|transloco" /></b>
          </mat-form-field>
          <mat-form-field>
            <input matInput formControlName="name" [placeholder]="'Form Name'|transloco" />
          </mat-form-field>
          <mat-form-field>
            <input
              matInput
              formControlName="icon"
              [placeholder]="'Icon Identifier'|transloco"
              [matAutocomplete]="autoicons"
            />
            <mat-icon matSuffix>{{fgroup.get('icon')?.value}}</mat-icon>
            <mat-autocomplete #autoicons="matAutocomplete">
              <mat-option *ngFor="let icon of filteredIcons | async" [value]="icon">
                <span>{{icon.replace('_', ' ')}}</span> <mat-icon>{{icon}}</mat-icon>
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>

          <mat-form-field>
            <mat-select
              [disableRipple]="true"
              formControlName="status"
              [placeholder]="'Form Statuses'|transloco"
              multiple
            >
              <div
                class="dino-status-option-container"
                *ngFor="let status of availableFormStatuses | async"
              >
                <mat-option class="dino-status-option" [value]="status.id">
                  <span [ngStyle]="{'color': status.color ?? 'inherit'}">{{status.label}}</span>
                </mat-option>
                <button
                  class="dino-status-edit-button"
                  mat-icon-button
                  (click)="openStatusEditor('Edit', status); $event.stopPropagation()"
                  [ngStyle]="{'color': status.color ?? 'inherit'}"
                >
                  <mat-icon>edit</mat-icon>
                </button>
              </div>

              <mat-option class="dino-new-status-button-option">
                <button
                  mat-button
                  color="primary"
                  class="dino-new-status-button"
                  (click)="openStatusEditor('Create'); $event.stopPropagation()"
                >
                  {{'Create new Status'|transloco}}
                  <mat-icon> add </mat-icon>
                </button>
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field>
            <mat-select formControlName="visibility" [placeholder]="'Visibility'|transloco">
              <mat-option [value]="0">{{ 'Private'|transloco }}</mat-option>
              <mat-option [value]="1">{{ 'Public'|transloco }}</mat-option>
            </mat-select>
          </mat-form-field>
        </form>

        <div class="dino-edit-form-schema-actions">
          <button mat-raised-button color="accent" translate (click)="openImportDialog()">
            {{'Import'|transloco}} <mat-icon>file_upload</mat-icon>
          </button>
          <button
            mat-raised-button
            color="accent"
            translate
            (click)="openRelationshipsDialog()"
            [disabled]="(isCreation|async) === true"
          >
            {{'Relationships'|transloco}} <mat-icon>cable</mat-icon>
          </button>
          <button
            mat-raised-button
            color="primary"
            translate
            (click)="save()"
            [disabled]="!fgroup.valid"
          >
            {{'Save'|transloco}} <mat-icon>save</mat-icon>
          </button>
        </div>
      </ng-container>
    </mat-card-header>
    <mat-card-content>
      <ajf-form-builder [form]="form"></ajf-form-builder>
    </mat-card-content>
  </mat-card>
</ng-container>
