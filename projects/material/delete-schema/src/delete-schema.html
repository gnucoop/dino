<h4 mat-dialog-title>{{dialogTitle|async}}</h4>
<mat-dialog-content>
  <ng-container> {{dialogMessage|async}} </ng-container>
</mat-dialog-content>
<br />
<mat-dialog-actions align="center">
  @if (isDeletable|async) {
    <button
      class="dino-confirm-button"
      mat-raised-button
      color="primary"
      (click)="confirmationResponse(true)"
    >
      {{'Yes'|transloco}}
    </button>
    <button
      class="dino-cancel-button"
      mat-raised-button
      color="accent"
      (click)="confirmationResponse(false)"
    >
      {{'No'|transloco}}
    </button>
  } @else {
    <button
      class="dino-cancel-button"
      mat-raised-button
      color="accent"
      (click)="confirmationResponse(false)"
    >
      {{'Close'|transloco}}
    </button>
  }
</mat-dialog-actions>
