<div class="vertical-item login-box">
  <form [formGroup]="loginForm">
    <ion-item lines="none">
      <ion-label [hidden]="true">Email</ion-label>
      <ion-input
          formControlName="email"
          id="dewco-login-email"
          type="text"
          [placeholder]="'Email'">
      </ion-input>
    </ion-item>
    <ion-item lines="none">
      <ion-label [hidden]="true">Password</ion-label>
      <ion-input
          formControlName="password"
          id="dewco-login-password"
          type="password"
          [placeholder]="'Password'">
      </ion-input>
    </ion-item>
    <div *ngIf="loginError" class="ion-padding error" id="dewco-login-error">Login Error</div>
    <div class="ion-padding">
      <ion-fab-button name="submitButton" [disabled]="loggingIn || (submitDisabled|async) === true" color="secondary" (click)="login()">
        <span class="dewco-screen-reader">Login button</span>
        <ion-icon name="arrow-forward"></ion-icon>
      </ion-fab-button>
    </div>
  </form>
</div>

<div class="footer vertical-item vertical-end">
  <div class="irhis-logo">
      <i class="dewco-icon irhis"></i>
  </div>
</div>
