<mat-grid-list
  class="dewco-grid-list"
  [cols]="(breakpointObserver.small|async) ? columnsSmall : columnsLarge"
  gutterSize="2.5em"
  rowHeight="1:1"
>
  <ng-container *ngFor="let item of items|async">
    <mat-grid-tile
      class="dewco-grid-tile"
      [routerLink]="item.url? item.url : ['/' + getCollectType + '-list', item.schemaId ? item.schemaId : item.name]"
    >
      <div>
        <div class="dewco-grid-action-icons" *ngIf="getCollectType === 'form'">
          <button
            mat-mini-fab
            color="primary"
            aria-label="Edit Form Schema"
            (click)="editFormSchema(item.schemaId); $event.stopPropagation();"
          >
            <mat-icon>create</mat-icon>
          </button>
        </div>
        <div class="title"></div>
        <div class="dewco-grid-icon">
          <mat-icon class="dewco-mat-icon">{{item.icon ?? 'list'}}</mat-icon>
        </div>
        <div class="dewco-grid-label">
          {{ (item.label ?? item.name)|transloco }}
        </div>
      </div>
    </mat-grid-tile>
  </ng-container>
</mat-grid-list>

<dewco-floating-button
  *ngIf="getCollectType === 'form'"
  [buttonIcon]="'add'"
  tooltipMessage="Add New Form Schema"
  (click)="addFormSchema()"
></dewco-floating-button>
