<div>
    <div class="logo-container">
      <div class="logo">
        <mat-icon fontSet="dewco-icon" fontIcon="irhis"></mat-icon>
      </div>
    </div>
    <div class="login-form-container">
      <form [class.error]="loginError" [formGroup]="loginForm">
        <input
            formControlName="email"
            name="email"
            type="text"
            aria-label="email"
            [placeholder]="'Username / email'">
        <input
            formControlName="password"
            name="password"
            type="password"
            aria-label="password"
            [placeholder]="'Password'">
        <div *ngIf="loginError === true" class="error-message">Invalid username and/or password</div>
        <button mat-fab type="submit" color="warn" aria-label="submit"
            (click)="login()"
            [disabled]="loggingIn || (submitDisabled|async) === true">
          <mat-icon>arrow_forward</mat-icon>
        </button>
        <div class="password-recover">
          <a mat-button routerLink="/auth/recover-password">{{ 'Forgot your password?' }} </a>
        </div>
        <mat-progress-bar [class.show]="loggingIn === true" mode="indeterminate"></mat-progress-bar>
      </form>
    </div>
  </div>
