<div class="dino-selector-container">
  <div>
    <h4>{{'Customize display'|transloco}}</h4>
    <p>{{'Alter the display of the table by selecting up to 7 columns'|transloco}}</p>
  </div>
  <br /><br />
  <div
    class="dino-column-selector"
    *ngFor="let column of columns; let i = index"
  >
    {{column.label|transloco}}
    <mat-slide-toggle
      [checked]="column.displayed || column.displayed === undefined"
      (change)="toggleColumn(i)"
    ></mat-slide-toggle>
  </div>
  <br />
  <button
    class="dino-apply-btn"
    mat-raised-button
    color="primary"
    (click)="apply()"
  >
    {{'Apply'|transloco}}
  </button>
</div>
