<ng-container *ngIf="reportInstance|async as repInstance">
  <div #printContainer class="report print">
    <ng-container *ngIf="metricsService.hasActiveMetrics|async">
      <mat-stepper labelPosition="bottom" #stepper linear>
        <mat-step
          [completed]="(isReportMetricsSelectorValid|async) || (isView|async)"
        >
          <ng-template matStepLabel>REPORT METRICS</ng-template>
          <div class="dewco-edit-report-step-buttons">
            <button
              mat-icon-button
              matStepperNext
              aria-label="Next step"
              [color]="(isReportMetricsSelectorValid|async) || (isView|async) ? '' : 'warn'"
            >
              <mat-icon>arrow_forward</mat-icon>
            </button>
          </div>
          <div class="dewco-edit-report-step-container">
            <dewco-form-metric-selector> </dewco-form-metric-selector>
          </div>
        </mat-step>
        <mat-step>
          <ng-template matStepLabel>REPORT DATA</ng-template>
          <div>
            <button
              mat-icon-button
              matStepperPrevious
              aria-label="Previous step"
            >
              <mat-icon>arrow_back</mat-icon>
            </button>
          </div>
          <div class="dewco-edit-report-step-container">
            <ajf-report id="report print" [instance]="repInstance"></ajf-report>
          </div>
        </mat-step>
      </mat-stepper>
    </ng-container>

    <ng-container *ngIf="(metricsService.hasActiveMetrics|async) === false">
      <ajf-report id="report print" [instance]="repInstance"></ajf-report>
    </ng-container>
  </div>
</ng-container>
