<form class="example-form">
    <mat-form-field class="example-full-width">
        <input type="text" placeholder="Pick a preset" aria-label="Pick a preset" matInput [formControl]="presetControl"
            [matAutocomplete]="auto">
        <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                {{option}}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>
</form>
<button mat-stroked-button (click)="loadPreset()"
    [disabled]="(presetName|async) == '' || (canLoadPreset|async) == false" aria-label="Load the preset">Apply</button>
<button mat-stroked-button (click)="savePreset()"
    [disabled]="(presetData|async) == null || (presetName|async) == ''" aria-label="Save the preset">Save</button>
