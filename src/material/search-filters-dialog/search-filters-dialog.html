<div class="menu">
    <div>
        <h2 mat-dialog-title>Search by values</h2>
    </div>
    <div class="elem">
        <button mat-raised-button (click)="search()" color="accent">search</button>
    </div>
    <!-- <button mat-button (click)="closeDialog()">x</button> -->
    <dewco-search-filters-chips (excludeFilter)="removeFilter($event, 'temporary')" [chipsType]="'temporary'">
    </dewco-search-filters-chips>
</div>

<mat-dialog-content>
    <mat-tab-group (selectedIndexChange)="setCurrentGroupId($event)">
        <mat-tab *ngFor=" let filterGroup of fts.generatedFilters|async;" [label]="filterGroup.filterGroupName"
            style="width: 100%">
            <ng-template matTabContent>
                <div class="dewco-filter-widgets-container">
                    <dewco-search-filters-widget *ngFor="let filterItem of filterItemsData|async;"
                        [filterItemData]="filterItem" (includeFilter)="addFilter($event, 'temporary')"
                        (excludeFilter)="removeFilter($event, 'temporary')">
                    </dewco-search-filters-widget>
                </div>
            </ng-template>
        </mat-tab>
    </mat-tab-group>
</mat-dialog-content>
