<dewco-list
  [headers]="headers"
  [baseEditUrl]="baseEditUrl"
  [dataSource]="dataSource"
  [additionalBasicFilters]="additionalBasicFilters"
  [additionalDataSchema]="additionalDataSchema|async"
  [listRowActions]="listRowActions"
  [expandable]="true"
  [onClickRowActions]="onClickRowActions"
>
  <dewco-search-filters-bar
    filters
    [presetManager]="true"
  ></dewco-search-filters-bar>
</dewco-list>

<dewco-floating-button
  [buttonIcon]="'add'"
  tooltipMessage="Add New form"
  (click)="addForm()"
></dewco-floating-button>
