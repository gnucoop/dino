<mat-toolbar>
    <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
    </button>
    Toolbar Title
</mat-toolbar>

<mat-sidenav-container>
    <mat-sidenav #sidenav mode="side" opened="true">
        <mat-nav-list>
            <a mat-list-item>
                <mat-icon>more_vert</mat-icon>
            </a>
            <a mat-list-item>
                <mat-icon>home</mat-icon>
            </a>
            <a mat-list-item>
                <mat-icon>menu</mat-icon>
            </a>
            <a mat-list-item>
                <mat-icon>favorite</mat-icon>
            </a>
            <a mat-list-item>
                <mat-icon>open_in_new</mat-icon>
            </a>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>

        <mat-table matSort [dataSource]="dataSource" style="width: 100%;">

            <!-- Checkbox Column -->
            <ng-container matColumnDef="select">
                <mat-header-cell *matHeaderCellDef>
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
                    </mat-checkbox>
                </mat-header-cell>
                <mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                    </mat-checkbox>
                </mat-cell>
            </ng-container>

            <!-- Position Column -->
            <ng-container matColumnDef="position">
                <mat-header-cell *matHeaderCellDef mat-sort-header> No. </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.position}} </mat-cell>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Name </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
            </ng-container>

            <!-- Weight Column -->
            <ng-container matColumnDef="weight">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Weight </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.weight}} </mat-cell>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="symbol">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Symbol </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.symbol}} </mat-cell>
            </ng-container>

            <!-- Actions Column -->

            <ng-container matColumnDef="actions" class="right">
                <mat-header-cell *matHeaderCellDef>
                </mat-header-cell>
                <mat-cell *matCellDef="let row">
                    <mat-icon mat-list-icon aria-label="delete icon">delete
                    </mat-icon>
                    <mat-icon mat-list-icon aria-label="printer icon">printer
                    </mat-icon>
                    <mat-icon mat-list-icon aria-label="get_app icon">get_app
                    </mat-icon>
                    <mat-icon mat-list-icon aria-label="create icon">create
                    </mat-icon>
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
            </mat-row>
        </mat-table>

    </mat-sidenav-content>

</mat-sidenav-container>

<br><br>
<div>
    <button mat-stroked-button (click)="changeTheme('e2e_main_theme')">Main Theme</button>
    <button mat-stroked-button (click)="changeTheme('e2e_alt_theme')">Alt Theme</button>
</div>
