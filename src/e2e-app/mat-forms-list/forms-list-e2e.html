<dino-list
  #dinoList
  [headers]="headers"
  [baseEditUrl]="baseEditUrl"
  [baseViewUrl]="baseViewUrl"
  [baseCreateUrl]="baseCreateUrl"
  [dataSource]="dataSource"
  [additionalBasicFilters]="additionalBasicFilters"
  [additionalDataSchema]="additionalDataSchema|async"
  [listRowActions]="listRowActions"
  [expandable]="true"
  [onClickRowActions]="onClickRowActions"
>
  <dino-search-filters-bar
    filters
    [presetManager]="true"
    [exportable]="true"
    (exportEvt)="dinoList.export($event)"
  ></dino-search-filters-bar>
</dino-list>

<dino-floating-button
  [buttonIcon]="'add'"
  tooltipMessage="Add New form"
  (click)="addForm()"
></dino-floating-button>
