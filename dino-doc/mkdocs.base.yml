site_name: Dino Documentation
site_url: https://gnucoop.github.io/dino/
docs_dir: docs/en
theme:
  name: material
  language: en
extra:
  alternate:
    - name: English
      link: /dino/en/
      lang: en
    - name: Italiano
      link: /dino/it/
      lang: it
    - name: Español
      link: /dino/es/
      lang: es
    - name: Français
      link: /dino/fr/
      lang: fr
    - name: Português
      link: /dino/pt/
      lang: pt
    - name: Українська
      link: /dino/uk/
      lang: uk
    - name: العربية
      link: /dino/ar/
      lang: ar
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
