name: Capture Screenshots

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinobitbucketpipeline:20.11.1
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Build e2e-app
        run: npx ng build e2e-app --configuration development

      - name: Serve app and capture screenshots
        run: |
          npx -y serve dist/e2e-app -s -l 4200 &
          sleep 8
          yarn cypress run --spec "cypress/e2e/docs-screenshots.cy.js" --headless --browser chrome

      - name: Commit and push screenshots
        run: |
          git config user.email "docs-bot@dinoapp.io"
          git config user.name "Docs Bot"
          git add docs/imgs/
          if ! git diff --cached --quiet; then
            git commit -m "docs: update screenshots [skip ci]"
            git push
          fi
