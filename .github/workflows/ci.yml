name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    name: Setup Packages, Lint and Build
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Lint
        run: yarn -s lint

      - name: Build
        run: ./scripts/build.mjs

  unit-tests:
    name: Model schema and Unit tests
    needs: [lint-and-build]
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    env:
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Model schema tests
        run: yarn -s model-schema-test

      - name: Unit tests
        run: yarn -s test:ci:core && yarn -s test:ci:material

  e2e-tests:
    name: E2E tests
    needs: [lint-and-build, unit-tests]
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    env:
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Install Cypress binary
        run: yarn cypress install

      - name: E2E tests
        run: ./scripts/e2e-ci.mjs

  release-and-publish:
    name: Build release, docs, Create Artifacts and Publish
    needs: [lint-and-build, unit-tests, e2e-tests]
    # Pull requests only need the validation jobs above; artifacts are produced
    # from the branch, once merged.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Release
        run: ./scripts/release.mjs

      - name: Build docs
        run: ./scripts/build-docs.mjs

      - name: Create build artifacts
        run: ./scripts/create-build-artifacts.mjs

      # - name: Publish
      #   run: ./scripts/publish.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/artifacts/**/*.tgz

  docker-image:
    name: Build and Push Dinoapp Docker image
    needs: [lint-and-build, unit-tests, e2e-tests]
    # Build/push only on release commits — the same gate Vercel uses in
    # projects/dinoapp/vercel-build-step.sh — so ordinary PR merges do not
    # produce an image.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.event.head_commit.message, 'release: cut the v') ||
      startsWith(github.event.head_commit.message, 'build: Manifest and worker sw_version upgraded to '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read Dino version and sw_version
        id: version
        # Docker tags cannot contain parentheses, so "18.0.4 (145)" becomes "18.0.4-145".
        run: |
          echo "tag=$(node -p "const d=require('./projects/dinoapp/ngsw-config.json').appData; d.version + '-' + d.sw_version")" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: devgnucoop/dinoapp
          tags: |
            type=raw,value=dev-${{ steps.version.outputs.tag }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=prod-${{ steps.version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
