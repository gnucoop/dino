name: CI

on:
  push:
    branches:
      - master

jobs:
  lint-and-build:
    name: Setup Packages, Lint and Build
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Lint
        run: yarn -s lint

      - name: Build
        run: ./scripts/build.mjs

  unit-tests:
    name: Model schema and Unit tests
    needs: [lint-and-build]
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    env:
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Model schema tests
        run: yarn -s model-schema-test

      - name: Unit tests
        run: yarn -s test:ci:core && yarn -s test:ci:material

  e2e-tests:
    name: E2E tests
    needs: [lint-and-build, unit-tests]
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    env:
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Install Cypress binary
        run: yarn cypress install

      - name: E2E tests
        run: ./scripts/e2e-ci.mjs

  release-and-publish:
    name: Build release, docs, Create Artifacts and Publish
    needs: [lint-and-build, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    container:
      image: devgnucoop/dinopipeline:22.16.0
    steps:
      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Release
        run: ./scripts/release.mjs

      - name: Build docs
        run: ./scripts/build-docs.mjs

      - name: Create build artifacts
        run: ./scripts/jenkins/create-build-artifacts.mjs

      - name: Publish
        run: ./scripts/publish.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/artifacts/**/*.tgz
