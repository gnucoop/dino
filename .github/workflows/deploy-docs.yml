name: Deploy Docs

# Publishes the Markdown committed under dino-doc/docs, with fresh screenshots of
# the app built from the same commit. The text is never generated here:
# docs-generate.mjs is run locally, on purpose, and its output is reviewed and
# edited by hand before being committed. Regenerating in CI would publish model
# output over those edits, and since the result is not committed back, the
# published page would change from one deploy to the next.
#
# main is published at the root of the site (/dino/<lang>/), dev under /dino/dev/<lang>/.
# GitHub Pages serves one site per repo, so the two versions are two folders of it.
#
# `workflow_run` only uses the version of this file present on the default branch.

on:
  workflow_run:
    workflows: ['CI']
    # Only the two published versions: any other branch whose CI passes would
    # republish the docs for nothing.
    branches:
      - main
      - dev
    types:
      - completed
  # TEMPORARY: test of the dev deploy, to be reverted before the PR.
  push:
    branches:
      - ci/docs-main-and-dev
jobs:
  docs:
    # The branch filter above is belt; this is braces, in case the trigger ever
    # gains another branch.
    if: >-
      ${{ github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
      github.event.workflow_run.head_branch == 'dev') }}
    runs-on: ubuntu-latest
    # A main deploy rewrites the whole of gh-pages and puts back the dev/ it finds
    # there: run alongside a dev deploy, it could put back the old one.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    env:
      DOCS_BRANCH: ${{ github.event_name == 'push' && 'dev' || github.event.workflow_run.head_branch }}
    permissions:
      contents: write

    steps:
      # ------------------------
      # Checkout repo
      # ------------------------
      # A workflow_run checks out the default branch unless told otherwise: without
      # the SHA a dev run would build and publish main. For main it pins the commit
      # that passed CI rather than whatever the branch points to by now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # ------------------------
      # Node setup
      # ------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ------------------------
      # Regenerate route map
      # ------------------------
      - name: Regenerate route map
        run: node dino-doc/scripts/docs-route-scanner.mjs

      # ------------------------
      # Build dinoapp (e2e mode) and serve for Cypress
      # ------------------------
      - name: Build dinoapp (e2e)
        run: npx ng build dinoapp --configuration=e2e

      - name: Serve dinoapp
        run: npx -y serve dist/dinoapp -s -l 4200 &

      - name: Wait for dinoapp on port 4200
        run: |
          echo "Waiting for http://localhost:4200..."
          for i in $(seq 1 90); do
            curl -sf http://localhost:4200 > /dev/null && echo "Ready after ${i}s" && exit 0
            sleep 2
          done
          echo "Timed out waiting for dinoapp" && exit 1

      # ------------------------
      # Run Cypress screenshots
      # ------------------------
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install Cypress binary
        run: yarn cypress install

      - name: Run Cypress screenshots
        run: |
          yarn cypress run \
            --project dino-doc \
            --spec dino-doc/cypress/e2e/docs-screenshots.cy.js \
            --browser chrome \
            --headless

      # ------------------------
      # Python + MkDocs
      # ------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      # ------------------------
      # Build MkDocs (all languages)
      # ------------------------
      # site_url and the language switcher links are absolute paths under /dino/.
      # Rewritten on the runner only, never committed.
      - name: Point the dev docs to /dino/dev/
        if: env.DOCS_BRANCH == 'dev'
        working-directory: dino-doc
        run: sed -i 's#/dino/#/dino/dev/#g' mkdocs.base.yml config/*/mkdocs.yml

      - name: Build MkDocs site
        working-directory: dino-doc
        run: |
          rm -rf site
          for lang in en it es fr pt uk ar; do
            echo "Building docs for $lang"
            mkdocs build --config-file "config/$lang/mkdocs.yml"
          done

      # ------------------------
      # Root redirect (optional landing page)
      # ------------------------
      - name: Copy root index
        run: cp dino-doc/site-root/index.html dino-doc/site/index.html

      # ------------------------
      # Keep Vercel off the docs branch
      # ------------------------
      # gh-pages is an orphan branch holding the built site and nothing else, so
      # the repo's own vercel.json never reaches it and the gate in
      # projects/dinoapp/vercel-build-step.sh cannot protect it: both Vercel
      # projects wired to this repo try to build the docs branch as if it were
      # the app, and fail. Shipping a vercel.json inside the site gives them an
      # ignore command that always skips. Exit 0 means "skip the build".
      #
      # The file belongs at the root of gh-pages, which only main's deploy writes.
      - name: Skip Vercel builds on gh-pages
        if: env.DOCS_BRANCH == 'main'
        run: |
          echo '{"ignoreCommand": "exit 0"}' > dino-doc/site/vercel.json

      # ------------------------
      # Deploy to GitHub Pages
      # ------------------------
      # main replaces gh-pages with a single orphan commit, so the dev/ already
      # published is carried over into the new site first. On the very first
      # deploy there is none yet.
      - name: Keep the published dev docs
        if: env.DOCS_BRANCH == 'main'
        run: |
          git fetch origin gh-pages || exit 0
          if git ls-tree -d --name-only origin/gh-pages dev | grep -q .; then
            git archive origin/gh-pages dev | tar -x -C dino-doc/site
          fi

      - name: Deploy main to GitHub Pages
        if: env.DOCS_BRANCH == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dino-doc/site
          publish_branch: gh-pages
          force_orphan: true

      # Without force_orphan and with keep_files off, only dev/ is emptied and
      # refilled: main's folders and the root files stay as they are.
      - name: Deploy dev to GitHub Pages
        if: env.DOCS_BRANCH == 'dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dino-doc/site
          publish_branch: gh-pages
          destination_dir: dev
